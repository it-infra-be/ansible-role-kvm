---
###
# Create new volumes
###
- name: Gather facts about storage pools
  community.libvirt.virt_pool:
    command: facts

- name: Create temporary files
  ansible.builtin.tempfile:
    state: file
    suffix: libvirt_volume_{{ item.name }}
  loop: '{{ kvm_storage_volumes | flatten(1) }}'
  loop_control:
    label: '{{ item.name }}'
  when: item.name not in (ansible_libvirt_pools[item.pool]['volumes'] | default([]))
  register: __registered_libvirt_volume_files

# Used copy instead of template in order to pass the loop dictionary (item)
- name: Create volume XML file
  ansible.builtin.copy:
    content: '{{ lookup("ansible.builtin.template", "storage_volume.xml.j2", template_vars=item.item) }}'
    dest: '{{ item.path }}'
    mode: '0644'
  loop: '{{ __registered_libvirt_volume_files.results | flatten(1) }}'
  loop_control:
    label: '{{ item.item.name }}'
  when: item.changed # noqa: no-handler

- name: Create volume
  ansible.builtin.command:
    argv: "{{ item.item.from is defined |
              ternary(['virsh', 'vol-create-from', item.item.pool, item.path, item.item.from],
                      ['virsh', 'vol-create', item.item.pool, item.path])
           }}"
  loop: '{{ __registered_libvirt_volume_files.results | flatten(1) }}'
  loop_control:
    label: '{{ item.item.name }}'
  changed_when: true
  when: item.changed # noqa: no-handler

- name: Set volume capacity for image based volumes
  ansible.builtin.command:
    argv:
      - virsh
      - vol-resize
      - '{{ item.item.name }}'
      - '{{ item.item.capacity }}'
      - --pool
      - '{{ item.item.pool }}'
  loop: '{{ __registered_libvirt_volume_files.results | flatten(1) }}'
  loop_control:
    label: '{{ item.item.name }}'
  changed_when: true
  when: item.changed and item.item.from is defined and item.item.capacity is defined

- name: Remove temporary file
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: '{{ __registered_libvirt_volume_files.results | flatten(1) }}'
  loop_control:
    label: '{{ item.item.name }}'
  when: item.changed # noqa: no-handler

###
# Change existing volumes
#
# Grow an existing volume when its configured 'capacity' is larger than the
# volume's current capacity. Sizes are compared in bytes so the check is
# idempotent; shrinking is not supported by libvirt and is left untouched.
###
- name: Get current capacity of existing volumes
  ansible.builtin.command:
    argv:
      - virsh
      - vol-info
      - --bytes
      - --pool
      - '{{ item.pool }}'
      - '{{ item.name }}'
  loop: '{{ kvm_storage_volumes | flatten(1) }}'
  loop_control:
    label: '{{ item.name }}'
  when:
    - item.capacity is defined
    - item.name in (ansible_libvirt_pools[item.pool]['volumes'] | default([]))
  changed_when: false
  check_mode: false  # read-only, so run it during a dry run too
  register: __registered_libvirt_volume_info

# In a dry run (--check) the virsh calls below are skipped, so show what they
# would have done instead.
- name: List storage volumes that would be created
  ansible.builtin.debug:
    msg: 'create: {{ item.name }} (pool {{ item.pool }})'
  loop: '{{ kvm_storage_volumes | flatten(1) }}'
  loop_control:
    label: '{{ item.name }}'
  when:
    - ansible_check_mode
    - item.name not in (ansible_libvirt_pools[item.pool]['volumes'] | default([]))

- name: List storage volumes that would be grown
  ansible.builtin.debug:
    msg: 'grow: {{ item.item.name }} ({{ __current_capacity | int | human_readable }} -> {{ __wanted_capacity | int | human_readable }})'
  loop: '{{ __registered_libvirt_volume_info.results | flatten(1) }}'
  loop_control:
    label: '{{ item.item.name }}'
  vars:
    __current_capacity: '{{ item.stdout_lines | default([]) | select("match", "^Capacity:") | first | regex_replace("[^0-9]", "") | int }}'
    __wanted_capacity: >-
      {%- set unit = item.item.capacity | string | regex_replace('[0-9 ]', '') | lower -%}
      {{ (item.item.capacity | string | regex_replace('[^0-9]', '') | int)
         * ((1000 if unit[1:] == 'b' else 1024) ** ('kmgtpe'.index(unit[0]) + 1) if unit not in ['', 'b', 'byte', 'bytes'] else 1) }}
  when:
    - ansible_check_mode
    - not (item.skipped | default(false))
    - __wanted_capacity | int > __current_capacity | int

- name: Grow volumes to match configured capacity
  ansible.builtin.command:
    argv:
      - virsh
      - vol-resize
      - '{{ item.item.name }}'
      - '{{ __wanted_capacity }}'
      - --pool
      - '{{ item.item.pool }}'
  loop: '{{ __registered_libvirt_volume_info.results | flatten(1) }}'
  loop_control:
    label: '{{ item.item.name }}'
  vars:
    # Convert 'capacity' to bytes with the same unit rules as libvirt:
    # 'G' and 'GiB' are 1024-based, 'GB' is 1000-based, no unit means bytes.
    __current_capacity: '{{ item.stdout_lines | default([]) | select("match", "^Capacity:") | first | regex_replace("[^0-9]", "") | int }}'
    __wanted_capacity: >-
      {%- set unit = item.item.capacity | string | regex_replace('[0-9 ]', '') | lower -%}
      {{ (item.item.capacity | string | regex_replace('[^0-9]', '') | int)
         * ((1000 if unit[1:] == 'b' else 1024) ** ('kmgtpe'.index(unit[0]) + 1) if unit not in ['', 'b', 'byte', 'bytes'] else 1) }}
  when:
    - not (item.skipped | default(false))
    - __wanted_capacity | int > __current_capacity | int
  changed_when: true
...
