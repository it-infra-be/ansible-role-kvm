---
###
# Based on Redhat 9 documentation:
# https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html/configuring_and_managing_virtualization/assembly_enabling-virtualization-in-rhel-9_configuring-and-managing-virtualization
###
- name: Install Virtualization packages
  ansible.builtin.dnf:
    name:
      - qemu-kvm
      - libvirt
      - virt-install
      - virt-viewer
    state: present

- name: Start Virtualization services
  ansible.builtin.systemd_service:
    state: started
    enabled: true
    name: '{{ item }}'
  loop:
    - virtqemud.socket
    - virtnetworkd.socket
    - virtnodedevd.socket
    - virtnwfilterd.socket
    - virtsecretd.socket
    - virtstoraged.socket
    - virtinterfaced.socket
    - virtqemud-ro.socket
    - virtnetworkd-ro.socket
    - virtnodedevd-ro.socket
    - virtnwfilterd-ro.socket
    - virtsecretd-ro.socket
    - virtstoraged-ro.socket
    - virtinterfaced-ro.socket
    - virtqemud-admin.socket
    - virtnetworkd-admin.socket
    - virtnodedevd-admin.socket
    - virtnwfilterd-admin.socket
    - virtsecretd-admin.socket
    - virtstoraged-admin.socket
    - virtinterfaced-admin.socket

- name: Detect the CPU vendor for the IOMMU kernel argument
  ansible.builtin.command: grep -m1 -oE 'GenuineIntel|AuthenticAMD' /proc/cpuinfo
  register: __registered_cpu_vendor
  changed_when: false
  check_mode: false
  failed_when: false
  when: kvm_enable_iommu

- name: Enable IOMMU on the kernel command line
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX="((?:(?!{{ __kvm_iommu_arg }}).)*?)"$'
    line: 'GRUB_CMDLINE_LINUX="\1 {{ __kvm_iommu_arg }} iommu=pt"'
    backrefs: true
    state: present
  vars:
    # 'iommu=pt' works for both; only the vendor flag differs.
    __kvm_iommu_arg: "{{ 'amd_iommu=on' if 'AuthenticAMD' in __registered_cpu_vendor.stdout else 'intel_iommu=on' }}"
  notify: update grub
  when: kvm_enable_iommu

- name: Validate if system is ready for virtualization
  ansible.builtin.command: /usr/bin/virt-host-validate
  register: __registered_virt_host_validate
  changed_when: false
  check_mode: false  # read-only, so run it during a dry run too
  failed_when: false  # never fail here; the next task decides

- name: Show host virtualization validation output
  ansible.builtin.debug:
    msg: '{{ __registered_virt_host_validate.stdout_lines }}'
  # virt-host-validate also exits non-zero on WARN. Only stop on a real FAIL,
  # or when the command itself could not run (return code 2 or higher).
  failed_when: >-
    __registered_virt_host_validate.rc not in [0, 1]
    or 'FAIL' in __registered_virt_host_validate.stdout
...
